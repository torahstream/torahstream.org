baseURL = "https://www.torahstream.org/"
title = "TorahStream"
languageCode = "en-us"
disablePathToLower = true
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]
[outputs]
  home = ["HTML", "SearchIndex"]
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true
[params]
  mediaHost = "https://media-cf.torahstream.org"
  # GA4 measurement ID (G-...); empty = no tracker emitted. Replaces the
  # retired Universal Analytics property UA-33191551-1 used by the old sites.
  ga4Id = "G-RLS7515PWK"
