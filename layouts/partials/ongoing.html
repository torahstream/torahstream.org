<h2>Currently ongoing</h2>
<table class="topics">
<tr><th>Series</th><th class="count">Shiurim</th><th>Latest</th><th class="sub">Podcast</th></tr>
{{ range sort (where .Site.Data.topics "ongoing" true) "last" "desc" }}
  <tr><td><a href="/{{ .dir }}/{{ .id }}/">{{ .title }}</a></td>
      <td class="count meta">{{ .count }}</td>
      <td class="meta latest">{{ .last }}</td>
      <td class="dl sub"><a class="btn small subscribe" data-feed="{{ $.Site.BaseURL }}{{ .dir }}/{{ .id }}/rss.xml"{{ with index $.Site.Data.apple_podcasts .id }} data-apple="https://podcasts.apple.com/us/podcast/id{{ . }}"{{ end }} href="/{{ .dir }}/{{ .id }}/rss.xml">Subscribe</a></td></tr>
{{ end }}
</table>
