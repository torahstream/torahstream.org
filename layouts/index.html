{{ define "main" }}
{{ partial "hero.html" . }}
<h2>Currently ongoing</h2>
<table class="topics">
<tr><th>Series</th><th class="count">Shiurim</th><th>Latest</th><th></th></tr>
{{ range sort (where .Site.Data.topics "ongoing" true) "last" "desc" }}
  <tr><td><a href="/{{ .dir }}/{{ .id }}/">{{ .title }}</a></td>
      <td class="count meta">{{ .count }}</td>
      <td class="meta latest">{{ .last }}</td>
      <td class="dl"><a href="/{{ .dir }}/{{ .id }}/rss.xml">Subscribe to podcast</a></td></tr>
{{ end }}
</table>
{{ partial "products.html" . }}
{{ end }}
